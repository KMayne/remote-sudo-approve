[package]
name = "remote-sudo-approve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Approve each sudo command with a passkey: request, rules and WebAuthn verification"

[lib]
name = "remote_sudo_approve"
path = "src/lib.rs"

[[bin]]
name = "remote-sudo-approve-verify"
path = "src/bin/verify.rs"

[[bin]]
name = "remote-sudo-approve-diff"
path = "src/bin/diff.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
base64 = "0.22"
getrandom = "0.2"
similar = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
